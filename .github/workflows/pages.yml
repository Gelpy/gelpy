name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Pushes, manual runs, and pull requests from this repository may read
      # the private @gelpy/design-system package. Pull requests from forks
      # never get the token and build with the default theme.
      TRUSTED_SOURCE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ env.TRUSTED_SOURCE == 'true' && secrets.GELPY_PACKAGES_TOKEN || '' }}
        run: npm ci

      - name: Require the brand theme
        if: env.TRUSTED_SOURCE == 'true'
        run: echo "GELPY_REQUIRE_BRAND=1" >> "$GITHUB_ENV"

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test site scripts
        run: npm test

      - name: Check public content
        run: npm run check:public

      - name: Check brand rules (no fonts, manual, or editables)
        run: npm run check:brand

      - name: Build site (en, es)
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
